name: deploy

# Builds web/ from the tip of main and publishes it to GitHub Pages. Runs when code under web/ is pushed,
# by hand, and from update.yml after a data commit (pushes made with GITHUB_TOKEN trigger no workflow).

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One deploy at a time; a running deploy is never cancelled, a newer request waits behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Not the event SHA: when update.yml calls this, that is the commit before its data commit.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
